name: duo_flex
description: >-
  Read HarmonyOS, web, Android and iOS display geometry, safe areas and fold
  data, and build responsive Flutter layouts from available space.
version: 0.4.0
homepage: https://pub.dev/packages/duo_flex
topics:
  - foldable
  - dual-screen
  - responsive
  - adaptive-layout
  - flutter-plugin
screenshots:
  - description: DuoFlex dashboard showing device, display, hinge, and layout data.
    path: assets/duo_flex_pubdev_screenshot.jpg
  - description: Animated DuoFlex dashboard showing fold state, hinge angle, and live viewport data.
    path: assets/duo_flex_device_video.gif

environment:
  sdk: ^3.13.2
  flutter: '>=3.47.2'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.duoflex.duo_flex
        pluginClass: DuoFlexPlugin
      ios:
        pluginClass: DuoFlexPlugin
      web:
        pluginClass: DuoFlexWeb
        fileName: src/web/duo_flex_web.dart
      ohos:
        pluginClass: DuoFlexPlugin
